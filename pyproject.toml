[project]
name = "cngeo"
version = "0.1.0"
description = "The lake and the city: cloud-native geospatial data and Earth embeddings, a one-day open-source workshop in Bengaluru"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "marimo>=0.16",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.4",
    "xarray>=2024.10",
    "zarr>=3.0",
    "fsspec>=2024.10",
    "pystac>=1.10",
    "pystac-client>=0.8",
    "odc-stac>=0.3.10",
    "duckdb>=1.1",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "altair>=5.5",
    "pillow>=10",
    "requests>=2.32",
    "pooch>=1.8",
    "geotessera>=0.11.0",
    "rio-cogeo>=7.0.4",
    "aiohttp>=3.14.4",
    "icechunk>=2.3.0",
    "rio-stac>=0.12.0",
    "obstore>=0.11.1",
]

[project.scripts]
cngeo = "cngeo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cngeo"]
